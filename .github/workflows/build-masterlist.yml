name: Build Dearbulut + Premium LATAM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-masterlist.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build combined playlist
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          import re
          import unicodedata
          from pathlib import Path

          URL = "https://dearbulut.github.io/iptv/playlists/country/ar.m3u"

          premium = [
              ('AMC', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="AMCLatinAmerica.us@Panregional",AMC', 'http://138.121.15.230:9002/AMC/index.m3u8'),
              ('AXN', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="AXNLatinAmerica.us@Panregional",AXN', 'http://181.119.66.28:8081/AXN/index.m3u8'),
              ('AXN South', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="AXNLatinAmerica.us@South",AXN South', 'http://45.228.235.116:8000/play/a0iy/index.m3u8'),
              ('Cinecanal', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="Cinecanal.us@Panregional",Cinecanal', 'http://181.119.66.28:8081/CINECANAL-HD/index.m3u8'),
              ('Comedy Central', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="ComedyCentralLatinAmerica.us@Panregional",Comedy Central', 'http://190.93.224.42/COMEDY-CENTRAL/index.m3u8'),
              ('Disney Channel', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="DisneyChannelLatinAmerica.ar@Panregional",Disney Channel', 'http://190.14.10.19:16000/play/a06z/index.m3u8'),
              ('Disney Jr.', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="DisneyJrLatinAmerica.ar@North",Disney Jr.', 'http://190.14.10.19:16000/play/a02d/index.m3u8'),
              ('FX', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="FXLatinAmerica.us@Panregional",FX', 'http://181.119.66.28:8081/FX-HD/index.m3u8'),
              ('History 2', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="History2LatinAmerica.us@Panregional",History 2', 'http://181.119.66.28:8081/HISTORY-2/index.m3u8'),
              ('History', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="HistoryLatinAmerica.us@Panregional",History', 'http://181.119.66.28:8081/History-HD/index.m3u8'),
              ('Lifetime', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="LifetimeLatinAmerica.us@Panregional",Lifetime', 'http://181.119.66.28:8081/Lifetime-HD/index.m3u8'),
              ('National Geographic', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="NationalGeographicLatinAmerica.us@Panregional",National Geographic', 'http://190.93.224.42/NAT-GEO/index.m3u8'),
              ('Star Channel', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="StarChannelLatinAmerica.us@Panregional",Star Channel', 'http://181.119.66.28:8081/STAR-CHANNEL/index.m3u8'),
              ('Studio Universal', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="StudioUniversalLatinAmerica.us@Panregional",Studio Universal', 'http://190.93.224.42/STUDIO-UNIVERSAL/index.m3u8'),
              ('TNT Novelas', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="TNTNovelas.us@Panregional",TNT Novelas', 'http://190.93.224.42/TNT-NOVELAS/index.m3u8'),
              ('Universal TV', '#EXTINF:-1 group-title="Premium Latinoamérica" tvg-id="UniversalTVLatinAmerica.us@Panregional",Universal TV', 'http://181.119.66.28:8081/Universal-HD/index.m3u8'),
          ]

          def norm(s):
              s = unicodedata.normalize("NFKD", s).encode("ascii", "ignore").decode().lower()
              s = re.sub(r"\([^)]*\)", "", s)
              s = re.sub(r"\[[^\]]*\]", "", s)
              s = re.sub(r"[^a-z0-9]+", " ", s)
              return re.sub(r"\s+", " ", s).strip()

          req = Request(URL, headers={"User-Agent": "IPTV-Argentina-builder/1.0"})
          base_bytes = urlopen(req, timeout=30).read()
          base = base_bytes.decode("utf-8")
          existing = {
              norm(line.rsplit(",", 1)[-1])
              for line in base.splitlines()
              if line.startswith("#EXTINF:")
          }

          missing = [entry for entry in premium if norm(entry[0]) not in existing]

          out = bytearray(base_bytes)
          if missing:
              if not out.endswith(b"\n"):
                  out.extend(b"\n")
              out.extend(b"\n# ============ PREMIUM LATINOAMERICA AGREGADO ============\n")
              for _, extinf, stream in missing:
                  out.extend((extinf + "\n" + stream + "\n").encode("utf-8"))

          Path("masterlist_argentina_latino.m3u").write_bytes(out)

          print(f"Dearbulut base entries: {sum(1 for x in base.splitlines() if x.startswith('#EXTINF:'))}")
          print(f"Premium entries defined: {len(premium)}")
          print(f"Premium entries added: {len(missing)}")
          print("Added:", ", ".join(x[0] for x in missing))
          print(f"Final entries: {sum(1 for x in out.decode('utf-8').splitlines() if x.startswith('#EXTINF:'))}")
          PY

      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add masterlist_argentina_latino.m3u
          git diff --cached --quiet && exit 0
          git commit -m "Build Dearbulut base with missing premium LATAM"
          git push
